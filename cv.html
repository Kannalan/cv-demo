<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计算机视觉 · 图像分类演示</title>
<style>
  :root{
    --bg:#0a0e17;
    --panel:#121826;
    --panel-2:#1a2233;
    --line:#243044;
    --txt:#e6edf7;
    --txt-dim:#8b9bb4;
    --accent:#4da3ff;
    --accent-2:#00e0c6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 20% -10%, #12243f 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #0d2a2a 0%, transparent 55%),
      var(--bg);
    color:var(--txt);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    min-height:100vh;
    padding:32px 20px 60px;
  }
  .wrap{max-width:960px;margin:0 auto;}

  header{text-align:center;margin-bottom:28px;}
  header h1{
    font-size:28px;letter-spacing:2px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header p{color:var(--txt-dim);margin-top:8px;font-size:13px;letter-spacing:1px;}

  /* 标签页 */
  .tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px;}
  .tab{
    padding:9px 18px;border-radius:999px;cursor:pointer;font-size:14px;
    background:var(--panel);border:1px solid var(--line);color:var(--txt-dim);
    transition:.2s;
  }
  .tab.active{
    color:#04101f;font-weight:600;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    border-color:transparent;
  }
  .tab.disabled{opacity:.45;cursor:not-allowed;}
  .tab.disabled::after{content:"  · 待开发";font-size:11px;}

  /* 面板 */
  .panel{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:18px;padding:22px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  .view{display:none;}
  .view.active{display:block;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  h2{font-size:17px;margin-bottom:6px;}
  .sub{color:var(--txt-dim);font-size:13px;margin-bottom:18px;line-height:1.7;}

  /* 上传区 */
  .drop{
    border:2px dashed var(--line);border-radius:14px;
    padding:38px 20px;text-align:center;cursor:pointer;
    transition:.2s;background:rgba(255,255,255,.01);
  }
  .drop:hover,.drop.over{border-color:var(--accent);background:rgba(77,163,255,.07);}
  .drop .icon{font-size:34px;margin-bottom:10px;}
  .drop p{font-size:14px;color:var(--txt-dim);}
  .drop b{color:var(--accent);}
  input[type=file]{display:none;}

  /* 预览 + 结果 布局 */
  .stage{display:grid;grid-template-columns:1fr;gap:18px;margin-top:18px;}
  @media(min-width:720px){.stage{grid-template-columns:320px 1fr;}}
  .preview img{
    width:100%;border-radius:12px;border:1px solid var(--line);display:block;
  }
  .preview .meta{margin-top:10px;font-size:12px;color:var(--txt-dim);}

  /* 结果条 */
  .results h3{font-size:14px;color:var(--txt-dim);font-weight:500;margin-bottom:14px;letter-spacing:1px;}
  .bar{margin-bottom:13px;}
  .bar .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;}
  .bar .name{font-weight:600;}
  .bar .score{color:var(--accent-2);font-variant-numeric:tabular-nums;}
  .track{height:9px;background:var(--panel);border-radius:99px;overflow:hidden;border:1px solid var(--line);}
  .fill{
    height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    transition:width .8s cubic-bezier(.2,.8,.2,1);
  }
  .bar:nth-child(2) .fill{transition-delay:.05s;}
  .bar:nth-child(3) .fill{transition-delay:.10s;}
  .bar:nth-child(4) .fill{transition-delay:.15s;}
  .bar:nth-child(5) .fill{transition-delay:.20s;}

  /* 状态 */
  .status{margin-top:16px;font-size:13px;color:var(--txt-dim);min-height:20px;}
  .status.err{color:#ff7b7b;}
  .spinner{
    display:inline-block;width:13px;height:13px;margin-right:8px;
    border:2px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .btn{
    margin-top:16px;padding:10px 22px;border:none;border-radius:10px;cursor:pointer;
    font-size:14px;font-weight:600;color:#04101f;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
  }
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  footer{text-align:center;margin-top:34px;color:var(--txt-dim);font-size:12px;line-height:2;}
  footer .kick{
    font-size:15px;letter-spacing:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>计算机视觉 · 五大任务</h1>
    <p>COMPUTER VISION IN ONE PICTURE</p>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="cls">图像分类</div>
    <div class="tab disabled">目标检测</div>
    <div class="tab disabled">图像分割</div>
    <div class="tab disabled">人脸识别</div>
    <div class="tab disabled">姿态估计</div>
  </div>

  <div class="panel">
    <!-- 图像分类 -->
    <div class="view active" id="view-cls">
      <h2>图像分类 · Image Classification</h2>
      <p class="sub">
        给它一张图，它告诉你<strong>整张图是什么</strong>，并按可能性从高到低排前五。
      </p>

      <div class="drop" id="drop">
        <div class="icon">🖼️</div>
        <p>点击这里，或把图片拖进来 —— 支持 <b>JPG / PNG</b></p>
      </div>
      <input type="file" id="file" accept="image/*">

      <div class="stage" id="stage" style="display:none;">
        <div class="preview">
          <img id="preview" alt="预览">
          <div class="meta" id="meta"></div>
        </div>
        <div class="results">
          <h3>TOP 5 预测</h3>
          <div id="bars"></div>
        </div>
      </div>

      <button class="btn" id="run" style="display:none;">开始识别</button>
      <div class="status" id="status"></div>
    </div>
  </div>

  <footer>
    <div class="kick">它不认识帅哥</div>
  </footer>
</div>

<script>
/* ============================================================
   百度 AI 开放平台 · 通用物体和场景识别（高级版）
   上线前请重置 AK/SK ！
   ============================================================ */
const BAIDU = {
  AK: 'iPSnmA4hZwn3w0VJATnu9zou',
  SK: '9zpfjeFG0SJkJFlICVWu0eHj64xzFdvR',   // 注意第9位是数字 0
  TOKEN_URL: 'https://aip.baidubce.com/oauth/2.0/token',
  CLASSIFY_URL: 'https://aip.baidubce.com/rest/2.0/image-classify/v2/advanced_general'
};

let tokenCache = { value: null, expireAt: 0 };
let currentFile = null;

/* ---------- 元素 ---------- */
const $drop   = document.getElementById('drop');
const $file   = document.getElementById('file');
const $stage  = document.getElementById('stage');
const $prev   = document.getElementById('preview');
const $meta   = document.getElementById('meta');
const $bars   = document.getElementById('bars');
const $run    = document.getElementById('run');
const $status = document.getElementById('status');

/* ---------- 工具 ---------- */
function setStatus(msg, isErr){
  $status.innerHTML = msg || '';
  $status.className = 'status' + (isErr ? ' err' : '');
}

function getToken(){
  const now = Date.now();
  if (tokenCache.value && now < tokenCache.expireAt) {
    return Promise.resolve(tokenCache.value);
  }
  const url = BAIDU.TOKEN_URL +
    '?grant_type=client_credentials' +
    '&client_id=' + encodeURIComponent(BAIDU.AK) +
    '&client_secret=' + encodeURIComponent(BAIDU.SK);

  return fetch(url, { method: 'POST' })
    .then(r => r.json())
    .then(d => {
      if (!d.access_token) {
        throw new Error('取 token 失败：' + (d.error_description || JSON.stringify(d)));
      }
      tokenCache.value = d.access_token;
      tokenCache.expireAt = now + (d.expires_in - 300) * 1000;
      return d.access_token;
    });
}

function fileToBase64(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result.split(',')[1]);
    fr.onerror = () => rej(new Error('读取图片失败'));
    fr.readAsDataURL(file);
  });
}

/* ---------- 选图 ---------- */
function pick(file){
  if (!file || !file.type.startsWith('image/')) {
    setStatus('请选择图片文件（JPG / PNG）', true);
    return;
  }
  if (file.size > 4 * 1024 * 1024) {
    setStatus('图片别超过 4MB，先压缩一下', true);
    return;
  }
  currentFile = file;
  $prev.src = URL.createObjectURL(file);
  $meta.textContent = file.name + ' · ' + (file.size / 1024).toFixed(1) + ' KB';
  $stage.style.display = 'grid';
  $run.style.display = 'inline-block';
  $run.disabled = false;
  $bars.innerHTML = '';
  setStatus('图片就绪，点「开始识别」');
}

$drop.addEventListener('click', () => $file.click());
$file.addEventListener('change', e => pick(e.target.files[0]));
['dragenter','dragover'].forEach(ev =>
  $drop.addEventListener(ev, e => { e.preventDefault(); $drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev =>
  $drop.addEventListener(ev, e => { e.preventDefault(); $drop.classList.remove('over'); }));
$drop.addEventListener('drop', e => pick(e.dataTransfer.files[0]));

/* ---------- 识别 ---------- */
$run.addEventListener('click', () => {
  if (!currentFile) return;
  $run.disabled = true;
  setStatus('<span class="spinner"></span>正在获取访问令牌…');

  let token;
  getToken()
    .then(t => {
      token = t;
      setStatus('<span class="spinner"></span>正在识别，请稍候…');
      return fileToBase64(currentFile);
    })
    .then(b64 => {
      const body = new URLSearchParams();
      body.append('image', b64);
      body.append('baike_num', '0');

      return fetch(BAIDU.CLASSIFY_URL + '?access_token=' + encodeURIComponent(token), {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString()
      });
    })
    .then(r => r.json())
    .then(d => {
      if (d.error_code) {
        throw new Error('[' + d.error_code + '] ' + d.error_msg);
      }
      render(d.result || []);
      setStatus('识别完成 · 耗时 ' + (d.log_id ? '正常' : '正常'));
    })
    .catch(err => {
      console.error(err);
      setStatus('出错了：' + err.message + '（若提示 Failed to fetch，说明没用 https 打开页面）', true);
    })
    .finally(() => { $run.disabled = false; });
});

function render(items){
  $bars.innerHTML = '';
  if (!items.length) {
    $bars.innerHTML = '<p style="color:var(--txt-dim);font-size:14px;">模型没认出什么，换张主体更清楚的图试试</p>';
    return;
  }
  items.slice(0, 5).forEach((it, i) => {
    const score = (it.score * 100).toFixed(1);
    const row = document.createElement('div');
    row.className = 'bar';
    row.innerHTML =
      '<div class="top">' +
        '<span class="name">' + (i + 1) + '. ' + it.keyword + '</span>' +
        '<span class="score">' + score + '%</span>' +
      '</div>' +
      '<div class="track"><div class="fill"></div></div>';
    $bars.appendChild(row);
    requestAnimationFrame(() => {
      row.querySelector('.fill').style.width = score + '%';
    });
  });
}

/* ---------- 标签页 ---------- */
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    if (t.classList.contains('disabled')) return;
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + t.dataset.tab).classList.add('active');
  });
});
</script>
</body>
</html>
